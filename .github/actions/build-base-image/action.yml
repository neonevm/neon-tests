name: "Build base test image"
description: "Build and push neon test base docker image"
inputs:
  image_tag:
    description: 'neon tests image tag'
    required: true
  image_name:
    description: 'neon tests image name'
    required: true
  oz_tag:
    description: 'tag name for oz tests'
    required: true
    default: latest
  docker_username:
    description: 'docker hub username'
    required: true
  docker_password:
    description: 'docker hub password'
    required: true
  docker_hub_org_name:
    description: 'docker hub organization name'
    required: true
  force_rebuild_base_image:
    description: 'flag to force rebuild basic image on current branch'
    required: true
    default: false

outputs:
  image_tag:
    description: 'The tag of the image to use for subsequent steps'
    value: ${{ steps.set_output.outputs.image_tag }}

  feature_branch_tag:
    description: 'The tag for feature branch '
    value: ${{ steps.feature_branch.outputs.feature_branch_tag }}

runs:
  using: composite
  steps:
    - uses: actions/checkout@v4

    - name: Define feature or version branch
      id: feature_branch
      shell: bash
      if: github.ref_name != 'develop'
      run: |
        if [[ "${{ github.ref }}" =~ "refs/heads/"[vt][0-9]+\.[0-9]+\.x ]]; then
         feature_branch_tag=${{ github.ref_name }}
        elif [[ "${{ github.head_ref }}" != "" ]]; then # pr to feature/develop branch
         feature_branch_tag=${{ github.head_ref }}
        fi;
         echo "feature_branch_tag=${feature_branch_tag}"
         echo "feature_branch_tag=${feature_branch_tag}" >> $GITHUB_OUTPUT

        # Set parent branch
        if [[ -n "${{ github.event.pull_request.base.ref }}" ]]; then
          echo "PARENT_BRANCH=${{ github.event.pull_request.base.ref }}" >> $GITHUB_ENV
        else
          echo "PARENT_BRANCH=develop" >> $GITHUB_ENV
        fi

    - name: Docker login
      shell: bash
      run: |
        echo "${{ inputs.docker_password }}" | docker login -u ${{ inputs.docker_username }} --password-stdin

    - name: Check if requirements folder changed
      id: check_requirements
      shell: bash
      run: |
        # Set PARENT_BRANCH to develop if not set (use output from previous step)
        parent_branch="${{ env.PARENT_BRANCH }}"
        if [[ -z "$parent_branch" ]]; then
          parent_branch="develop"
          echo "PARENT_BRANCH=develop" >> $GITHUB_ENV
        fi

        echo "Using parent branch: $parent_branch"

        # Fetch parent branch
        git fetch --depth 1 origin $parent_branch

        # Check if there are changes in the requirements folder or Dockerfile-base
        if git diff --name-only HEAD origin/$parent_branch | \
          grep -E "^requirements/|^Dockerfile-base$|^.github/actions/build-base-image/"; then
          echo "Requirements folder | Dockerfile-base | Build-base-image action have changed"
          echo "changed=true" >> $GITHUB_OUTPUT
        else
          echo "Requirements folder | Dockerfile-base | Build-base-image action have not changed"
          echo "changed=false" >> $GITHUB_OUTPUT
        fi

    - name: Determine if build is needed
      id: need_build
      shell: bash
      run: |
        if [[ "${{ steps.check_requirements.outputs.changed }}" == "false" && "${{ inputs.force_rebuild_base_image }}" == "false" ]]; then
          echo "Requirements didn't change, using parent image"
          echo "need_build=false" >> $GITHUB_OUTPUT
          if [[ "${{ env.PARENT_BRANCH }}" == "develop" ]]; then
            echo "use_image=${{ inputs.image_name }}:latest" >> $GITHUB_OUTPUT
            echo "Parent branch is develop, using tagged 'latest' image"
          else
            echo "use_image=${{ inputs.image_name }}:${{ env.PARENT_BRANCH }}" >> $GITHUB_OUTPUT
          fi
        else
          echo "Requirements changed, need to build new image or Force Rebuild"
          echo "need_build=true" >> $GITHUB_OUTPUT
          echo "use_image=${{ inputs.image_name }}:${{ inputs.image_tag }}" >> $GITHUB_OUTPUT
        fi

    - name: Build and push neon tests docker image
      id: build_image
      if: steps.need_build.outputs.need_build == 'true'
      shell: bash
      env:
        DOCKER_HUB_ORG_NAME: ${{ inputs.docker_hub_org_name }}
      run: |
        image_name=${{ inputs.image_name }}
        delimiter=$(printf "%0.s-" {1..30})
        echo " ${delimiter} Build new docker image ${image_name} ${delimiter}"

        docker build . --no-cache --tag ${image_name}:${{ inputs.image_tag }} \
            --file Dockerfile-base \
            --build-arg OZ_TAG=${{ inputs.oz_tag }} \
            --build-arg CONTRACTS_BRANCH="main" \
            --build-arg DOCKER_HUB_ORG_NAME=${{env.DOCKER_HUB_ORG_NAME}}

        # Tag with branch name if available
        if [[ "${{ steps.feature_branch.outputs.feature_branch_tag }}" != "" ]]; then
          docker tag ${image_name}:${{ inputs.image_tag }} ${image_name}:${{ steps.feature_branch.outputs.feature_branch_tag }}
        fi

        echo "${delimiter} Pushing image to Docker registry ${delimiter}"
        docker push --all-tags ${image_name}

    - name: Skip build notification
      if: steps.need_build.outputs.need_build == 'false'
      shell: bash
      run: |
        echo "Skipping build as using existing image: ${{ steps.need_build.outputs.use_image }}"

    - name: Set output
      id: set_output
      shell: bash
      run: |
        if [[ "${{ steps.need_build.outputs.need_build }}" == "true" && "${{ steps.feature_branch.outputs.feature_branch_tag }}" != "" ]]; then
          echo "image_tag=${{ steps.feature_branch.outputs.feature_branch_tag }}" >> $GITHUB_OUTPUT
        else
          # Extract tag from the use_image
          use_image="${{ steps.need_build.outputs.use_image }}"
          image_tag=${use_image#*:}
          echo "image_tag=${image_tag}" >> $GITHUB_OUTPUT
        fi
