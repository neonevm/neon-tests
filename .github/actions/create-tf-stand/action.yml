name: "Prepare stand"
description: "Create terraform stand"
outputs:
  proxy_ip:
    description: "proxy ip"
    value: ${{ steps.share.outputs.proxy_ip }}
  solana_ip:
    description: "solana ip"
    value: ${{ steps.share.outputs.solana_ip }}
inputs:
  hcloud_token:
    required: true
  aws_secret_access_key_id:
    required: true
  aws_secret_access_key:
    required: true
  use_real_price:
    description: 'Remove CONST_GAS_PRICE option from proxy'
    default: '0'
    required: false
  memory:
    description: "Instance memory amount"
    default: 32
    required: false
  cpu:
    description: "Instance CPU amount"
    default: 16
    required: false
  docker_username:
    description: 'docker hub username'
    required: true
  docker_password:
    description: 'docker hub password'
    required: true


runs:
  using: composite

  steps:
  - uses: actions/checkout@v4
    with:
        fetch-depth: 0
  - uses: actions/checkout@v4
    with:
      repository: 'neonlabsorg/dynamic-ci-cd'
      ref: 'main'
      token: ${{ secrets.GHTOKEN }}
      path: ./dynamic-ci-cd/.github/workflows
  - name: Create instance
    uses: ./dynamic-ci-cd/.github/workflows/actions/create-instance
    id: create-instance
    with:
      project-repository: ${{ github.event.repository.name }}
      run-id: ${{github.run_id}}
      cpu: 16
      memory: 32
      hcloud-token: ${{ inputs.hcloud_token }}
  - name: Copy docker-compose files
    uses: appleboy/scp-action@v0.1.7
    with:
      host: ${{ steps.create-instance.outputs.public-ip-v4 }}
      username: ${{ steps.create-instance.outputs.ssh-user }}
      key: ${{ steps.create-instance.outputs.ssh-key }}
      port: 22
      source: "./github/actions/create-tf-stand/docker-compose-ci.yaml"
      target: "/tmp/"
      strip_components: 1
  - name: Deploy containers
    uses: appleboy/ssh-action@v1
    with:
      host: ${{ steps.create-instance.outputs.public-ip-v4 }}
      username: ${{ steps.create-instance.outputs.ssh-user }}
      key: ${{ steps.create-instance.outputs.ssh-key }}
      port: 22
      script_path: ./github/actions/create-tf-stand/stand_init.sh
      envs: REVISION,SOLANA_URL,SOLANA_WS_URL,NEON_EVM_COMMIT,FAUCET_COMMIT,CI_PP_SOLANA_URL,DOCKERHUB_ORG_NAME,DEVNET_SOLANA_URL
    env:
      REVISION: ${{ needs.build-image.outputs.proxy_sha_tag }}
      SOLANA_URL: "http://nginx:8080/"
      SOLANA_WS_URL: "http://solana:8900/"
      NEON_EVM_COMMIT: ${{ needs.build-image.outputs.evm_sha_tag || needs.build-image.outputs.evm_tag }}
      FAUCET_COMMIT: ${{ needs.build-image.outputs.faucet_tag }}
      CI_PP_SOLANA_URL: ${{secrets.DEVNET_INTERNAL_RPC}}
      DOCKERHUB_ORG_NAME: ${{vars.DOCKERHUB_ORG_NAME}}
      DEVNET_SOLANA_URL: ${{secrets.DEVNET_SOLANA_URL}}
  outputs:
    ssh_user: ${{ steps.create-instance.outputs.ssh-user }}
    ssh_key: ${{ steps.create-instance.outputs.ssh-key }}
    solana_ip: ${{ steps.create-instance.outputs.public-ip-v4 }}
    proxy_ip: ${{ steps.create-instance.outputs.public-ip-v4 }}
  
