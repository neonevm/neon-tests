name: "Operator economy"

on:
  schedule:
    - cron: "0 6 * * 0,1,2,3,4"
  workflow_dispatch:
    inputs:
      pytest_k:
        type: string
        default: "test_"
        required: false
        description: "Filter tests by name: pytest -k ..."
      pytest_m:
        type: string
        default: ""
        required: false
        description: "Filter tests by mark: pytest -m ..."

env:
  NETWORK: 'terraform'
  BUILD_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
  IMAGE:  ${{ github.repository_owner }}/neon_tests
  CONTAINER:  "economy-${{ github.run_id }}"
  DOCKER_HUB_ORG_NAME: ${{ github.repository_owner }}
  DEVNET_SOLANA_URL: ${{secrets.SOLANA_URL}}
jobs:
  dockerize:
    if: ${{ github.ref_name != 'develop'}}
    runs-on: ["gha-runner-scale-set-large"]
    steps:
      - uses: actions/checkout@v4
      - name: "Dockerize neon tests"
        id: requirements
        uses: ./.github/actions/dockerize-neon-tests
        with:
          image_tag: ${{ github.sha }}
          docker_username: ${{ secrets.DOCKER_USERNAME }}
          docker_password: ${{ secrets.DOCKER_PASSWORD }}
          image_name: ${{ env.IMAGE }}
          docker_hub_org_name: ${{ env.DOCKER_HUB_ORG_NAME }}
  prepare-env:
    runs-on: ["gha-runner-scale-set"]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 16
      - name: "Prepare terraform stand"
        id: prepare_terraform
        if: ${{ env.NETWORK == 'terraform' }}
        uses: ./.github/actions/create-tf-stand
        with:
          use_real_price: "1"
          docker_username: ${{ secrets.DOCKER_USERNAME }}
          docker_password: ${{ secrets.DOCKER_PASSWORD }}
          aws_default_region: "eu-central-1"
          aws_secret_access_key_id: ${{ secrets.CI_AWS_ACCESS_KEY }}
          aws_secret_access_key: ${{ secrets.CI_AWS_SECRET_ACCESS_KEY }}
          gh_token: ${{ secrets.GHTOKEN }}
          dockerhub_org_name: ${{ github.repository_owner }}
          devnet_solana_url: "${{ secrets.SOLANA_URL }}"
          hcloud_token: ${{ secrets.HCLOUD_TOKEN }}
        timeout-minutes: 15

    outputs:
      proxy_ip: ${{ steps.prepare_terraform.outputs.instance_public_ip_v4 }}
      solana_ip: ${{ steps.prepare_terraform.outputs.instance_public_ip_v4 }}
      docker_ca_cert: ${{ steps.prepare_terraform.outputs.docker_ca_cert }}
      docker_cert: ${{ steps.prepare_terraform.outputs.docker_cert }}
      docker_key: ${{ steps.prepare_terraform.outputs.docker_key }}
      network: ${{ env.NETWORK }}

  tests:
    name: "Operator tests"
    needs:
      - prepare-env
      - dockerize
    runs-on: ["gha-runner-scale-set"]
    env:
      NETWORK: ${{ needs.prepare-env.outputs.network }}
      SOLANA_IP: ${{ needs.prepare-env.outputs.solana_ip }}
      PROXY_IP: ${{ needs.prepare-env.outputs.proxy_ip }}
    if: |
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    steps:
      - uses: actions/checkout@v4
      - name: Define image tag
        id: image_tag
        uses: ./.github/actions/define-image-tag
      - name: Log in to Docker Hub
        uses: docker/login-action@v3.1.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Run docker container
        run: |
          docker pull ${{ env.IMAGE }}:${{ steps.image_tag.outputs.tag }}
          docker run -i -d -e SOLANA_IP -e PROXY_IP -e CI \
            --name=${{ env.CONTAINER }} ${{ env.IMAGE }}:${{ steps.image_tag.outputs.tag }} \
            /bin/bash
      - name: Run economy tests
        run: |
          docker exec -i ${{ env.CONTAINER }} python3 ./clickfile.py run economy --network ${{ env.NETWORK }} --case "${{ github.event.inputs.pytest_k}}" --marker "${{ github.event.inputs.pytest_m}}"
      - name: "Generate allure report"
        id: generate-allure-report
        uses: ./.github/actions/generate-allure-report
        if: always()
        with:
          container: ${{ env.CONTAINER }}
          network: ${{ env.NETWORK }}
          aws_access_key_id:  ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_access_key:  ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          tests_name: economy
      - name: Notify on failure
        if: failure() && github.ref_name == 'develop'
        run: |
          docker exec -i ${{ env.CONTAINER }} python3 ./clickfile.py send-notification \
            -u ${{ secrets.SLACK_QA_CHANNEL_URL }} \
            --network ${{ env.NETWORK }} \
            -b ${{ env.BUILD_URL }} \
            --test-group economy \
            --report-group economy \
            --report-url ${{ steps.generate-allure-report.outputs.allure_report_url }}
      - name: Remove docker container
        if: always()
        run: docker rm -f ${{ env.CONTAINER }}
  destroy:
    runs-on: ["gha-runner-scale-set"]
    needs: [ prepare-env, tests ]
    if: always() && needs.prepare-env.outputs.network == 'terraform' && !contains(needs.prepare-env.result, 'cancelled')
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 16
      - name: Destroy stand
        uses: ./.github/actions/destroy-tf-stand
        with:
          instance_public_ipv4: ${{ needs.prepare-env.outputs.proxy_ip }}
          docker_ca_cert: ${{ needs.prepare-env.outputs.docker_ca_cert }}
          docker_cert: ${{ needs.prepare-env.outputs.docker_cert }}
          docker_key: ${{ needs.prepare-env.outputs.docker_key }}
          aws_secret_access_key_id: ${{ secrets.CI_AWS_ACCESS_KEY }}
          aws_default_region: "eu-central-1"
          aws_secret_access_key: ${{ secrets.CI_AWS_SECRET_ACCESS_KEY }}
          gh_token: ${{ secrets.GHTOKEN }}
          hcloud_token: ${{ secrets.HCLOUD_TOKEN }}


